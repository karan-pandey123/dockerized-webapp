services:
  webapp:
    build: .
    container_name: flask_webapp
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - webapp_network

  mongodb:
    image: mongo:7
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - webapp_network

networks:
  webapp_network:
    driver: bridge

volumes:
  mongo_data: